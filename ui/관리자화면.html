<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인</title>
    <style>
        body {
            background-color: #F8FAFC;            ;
            font-family: 'Pretendard';
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .back-btn {
            position: absolute;
            top: 15px;
            width: 40px;
            cursor: default;
            z-index: 10;
            left: 20px;
        }
        .login-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #F8FAFC; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-content {
            background: rgba(200, 200, 200, 0.9); 
            padding: 20px;
            border-radius: 10px;
            background-color: #F8FAFC;
            width: 300px;
        }

        .login-content h2 {
            font-size: 28px;
            font-style: normal;
            font-weight: 500;
            margin-bottom: 50px;
        }

        .login-content input {
            display: flex;
            width: 93%;
            margin-bottom: 20px;
            padding: 10px;
            background: #E0E7F2;
            border: none;
            border-radius: 8px;
            text-align: left;
        }

        .login-content button {
            background: #2762A2;
            color: white;
            padding: 10px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .login-content button:hover {
            background: #E0E7F2;
        }

        .navi {
            width: 1440px;
            height: 65px;
            flex-shrink: 0;
            border-bottom: 1px solid #CBD5E1;
            background: #F8FAFC;
        }
    </style>
</head>
<body>
    <div class="navi">
        <img src="left-btn.png" alt="Back Icon" class="back-btn" onclick="location.href='메인화면.html'">
    </div>

    <<div id="admin-login" class="login-popup">
        <div class="login-content">
            <h2>Admin</h2>
            <input type="text" id="admin-id" placeholder="Username">
            <input type="password" id="admin-password" placeholder="Password">
            <button onclick="checkAdminLogin()">Login</button>
        </div>
    </div>

    <script>
        function openLoginPopup() {
            document.getElementById("admin-login").style.display = "flex";
        }

        function closeLoginPopup() {
            document.getElementById("admin-login").style.display = "none";
        }

        function closeAndGoBack() {
            window.location.href = "메인화면.html";
        }

        function checkAdminLogin() {
            const adminId = document.getElementById("admin-id").value;
            const adminPassword = document.getElementById("admin-password").value;

            if (adminId === "admin" && adminPassword === "1234") {  
                alert("로그인 성공! 관리자 화면으로 이동합니다.");
                window.location.href = "관리자데이터추가.html"; 
            } else {
                alert("아이디 또는 비밀번호가 틀렸습니다.");
            }
        }
        document.addEventListener("DOMContentLoaded", function () {
            const inputs = document.querySelectorAll(".login-content input");

            inputs.forEach(input => {
                input.addEventListener("keypress", function (event) {
                    if (event.key === "Enter") {
                        event.preventDefault();  
                        checkAdminLogin();  
                    }
                });
            });
        });

    </script>

</body>
</html>
